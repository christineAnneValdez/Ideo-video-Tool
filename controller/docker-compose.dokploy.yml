services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opentalk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-opentalk}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-OPENTALK}
      KEYCLOAK_FRONTEND_ORIGIN: ${FRONTEND_BASE_URL:-http://localhost:3000}
      KEYCLOAK_CONTROLLER_CLIENT_SECRET: ${CONTROLLER_OIDC_CLIENT_SECRET:-local-dev-secret}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-controller};
      "
    restart: "no"

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"

  controller:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    command: ["-c", "/etc/opentalk/controller.toml"]
    environment:
      OPENTALK_CTRL_FRONTEND__BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      OPENTALK_CTRL_HTTP__ADDR: 0.0.0.0
      OPENTALK_CTRL_HTTP__PORT: 11311
      OPENTALK_CTRL_DATABASE__URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-opentalk}
      OPENTALK_CTRL_OIDC__AUTHORITY: http://keycloak:8080/realms/${KEYCLOAK_REALM:-OPENTALK}
      OPENTALK_CTRL_OIDC__FRONTEND__CLIENT_ID: ${FRONTEND_OIDC_CLIENT_ID:-Frontend}
      OPENTALK_CTRL_OIDC__CONTROLLER__CLIENT_ID: ${CONTROLLER_OIDC_CLIENT_ID:-Controller}
      OPENTALK_CTRL_OIDC__CONTROLLER__CLIENT_SECRET: ${CONTROLLER_OIDC_CLIENT_SECRET:-local-dev-secret}
      OPENTALK_CTRL_USER_SEARCH__BACKEND: keycloak_webapi
      OPENTALK_CTRL_USER_SEARCH__API_BASE_URL: http://keycloak:8080/admin/realms/${KEYCLOAK_REALM:-OPENTALK}
      OPENTALK_CTRL_USER_SEARCH__USERS_FIND_BEHAVIOR: ${USERS_FIND_BEHAVIOR:-from_user_search_backend}
      OPENTALK_CTRL_LIVEKIT__PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      OPENTALK_CTRL_LIVEKIT__SERVICE_URL: http://livekit:7880
      OPENTALK_CTRL_LIVEKIT__API_KEY: ${LIVEKIT_API_KEY:-devkey}
      OPENTALK_CTRL_LIVEKIT__API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      OPENTALK_CTRL_MINIO__URI: http://minio:9000
      OPENTALK_CTRL_MINIO__BUCKET: ${MINIO_BUCKET:-controller}
      OPENTALK_CTRL_MINIO__ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OPENTALK_CTRL_MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${CONTROLLER_PORT:-11311}:11311"

  frontend:
    build:
      context: ../web-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      CONTROLLER_HOST: ${FRONTEND_CONTROLLER_HOST:-localhost:11311}
      INSECURE: ${FRONTEND_INSECURE:-true}
      OIDC_ISSUER: ${OIDC_ISSUER_PUBLIC_URL:-http://localhost:8080/realms/${KEYCLOAK_REALM:-OPENTALK}}
      OIDC_CLIENT_ID: ${FRONTEND_OIDC_CLIENT_ID:-Frontend}
      BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
  keycloak_db_data:
  minio_data:
