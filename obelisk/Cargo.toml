[package]
name = "opentalk-obelisk"
version = "0.21.0"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
license = "EUPL-1.2"
publish = false
build = "build.rs"

[dependencies]
anstream = "1.0"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bitstream-io = "4"
bytes = "1"
bytesstr = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
directories = "6.0"
env_logger = "0.11"
ezk = "0.1"
ezk-audio = "0.1"
ezk-audio-nodes = "0.1"
ezk-g711 = "0.2"
ezk-g722 = "0.1"
ezk-image = "0.4"
ezk-rtp = "0.2"
futures = "0.3"
h264-profile-level-id = "0.2"
hound = "3.5"
itertools = "0.14"
jsonwebtoken = "10"
log = "0.4"
native-tls = "0.2"
once_cell = "1.18"
openh264 = "0.9"
openh264-sys2 = "0.9"
openidconnect = "4"
opentalk-compositor = { version = "0.17", default-features = false }
opentalk-version = "0.4.0"
owo-colors = "4"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rtp = "0.17"
sdp-types = { version = "0.6", package = "ezk-sdp-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service-probe = "0.4"
service-probe-client = "0.4"
sip-auth = { version = "0.5", package = "ezk-sip-auth" }
sip-core = { version = "0.8", package = "ezk-sip-core", features = ["tls-native-tls"] }
sip-types = { version = "0.6", package = "ezk-sip-types" }
sip-ua = { version = "0.8", package = "ezk-sip-ua" }
srtp = "0.7"
stun-types = { version = "0.3", package = "ezk-stun-types" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
tokio-native-tls = "0.3"
tt = { package = "tokio-tungstenite", version = "0.29", features = ["rustls-tls-native-roots"] }
types-common = { package = "opentalk-types-common", version = "0.42", features = ["serde"] }
types-signaling = { package = "opentalk-types-signaling", version = "0.44", features = ["serde"] }
types-signaling-control = { package = "opentalk-types-signaling-control", version = "0.44", features = ["serde"] }
types-signaling-livekit = { package = "opentalk-types-signaling-livekit", version = "0.45", features = ["serde"] }
types-signaling-recording = { package = "opentalk-types-signaling-recording", version = "0.43", features = ["serde"] }
url = { version = "2.2", features = ["serde"] }
webrtc-sys = "0.3"

[patch.crates-io]
# Removes duplicate paste and therefore some compile time
bitpattern = { git = 'https://github.com/kbalt/bitpattern', branch = 'remove-paste-010-patch' }

# Until https://github.com/livekit/rust-sdks/pull/544 and https://github.com/livekit/rust-sdks/issues/546 are resolved
webrtc-sys = { git = "https://github.com/kbalt/rust-sdks.git", rev = "bf5622058e2c2187436953ca13c4cc79176c0d74" }
libwebrtc = { git = "https://github.com/kbalt/rust-sdks.git", rev = "bf5622058e2c2187436953ca13c4cc79176c0d74" }
livekit = { git = "https://github.com/kbalt/rust-sdks.git", rev = "bf5622058e2c2187436953ca13c4cc79176c0d74" }
livekit-api = { git = "https://github.com/kbalt/rust-sdks.git", rev = "bf5622058e2c2187436953ca13c4cc79176c0d74" }
livekit-runtime = { git = "https://github.com/kbalt/rust-sdks.git", rev = "bf5622058e2c2187436953ca13c4cc79176c0d74" }
livekit-protocol = { git = "https://github.com/kbalt/rust-sdks.git", rev = "bf5622058e2c2187436953ca13c4cc79176c0d74" }

# Update libsrtp to 2.6 & newer bindgen version until https://github.com/HyeonuPark/srtp2-sys/pull/3 is merged
srtp2-sys = { git = "https://github.com/kbalt/srtp2-sys.git", rev = "fb3d67b5ada52d242c2ab5a06e4e6e22db31d601" }

[build-dependencies]
anyhow = "1"
opentalk-version = "0.4"

[workspace]
members = [".", "xtask"]
