; Minimal local SIP config for Obelisk testing.

[global]
type=global
user_agent=OpenTalk-Asterisk-Lab

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Softphone user
[1001]
type=aor
max_contacts=1

[1001]
type=auth
auth_type=userpass
username=1001
password=1001pass

[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=1001
aors=1001

; Obelisk endpoint (matches obelisk/config.local.toml)
[obelisk]
type=aor
max_contacts=1

[obelisk]
type=auth
auth_type=userpass
username=obelisk
password=obeliskpass

[obelisk]
type=endpoint
context=from-obelisk
disallow=all
allow=ulaw,alaw
auth=obelisk
aors=obelisk
