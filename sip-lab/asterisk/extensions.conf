[general]
static=yes
writeprotect=no

[from-internal]
; Dial 700 from your softphone (1001) to call Obelisk
exten => 700,1,NoOp(Call Obelisk)
 same => n,Dial(PJSIP/obelisk,30)
 same => n,Hangup()

; Self-test route
exten => 1001,1,NoOp(Self test 1001)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

[from-obelisk]
; Fallback route for calls initiated by Obelisk
exten => _X.,1,NoOp(Call from Obelisk to ${EXTEN})
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()
